name: Docker Image CI and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PHIMISCI_TS_OS_TOKEN }}

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository }}-phimisci:${{ steps.version.outputs.VERSION }} \
            -t ghcr.io/${{ github.repository }}-phimisci:latest \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}-phimisci:${{ steps.version.outputs.VERSION }}
          docker push ghcr.io/${{ github.repository }}-phimisci:latest

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PHIMISCI_TS_OS_TOKEN }}
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            **Docker Images:**
            - `${{ github.repository }}-phimisci:${{ github.ref_name }}`
            - `${{ github.repository }}-phimisci:latest`
          draft: false
          prerelease: false
